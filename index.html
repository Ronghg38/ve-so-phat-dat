<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tham khảo Xổ Số miền Nam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* Khóa chặt khung nhìn trong màn hình thực tế, chống tràn đáy */
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Thanh tiêu đề trên cùng (Thu gọn) */
    .app-bar {
      background-color: #0b4a92;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 10px;
      height: 32px;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .app-bar .back-btn {
      margin-right: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    /* Thanh chọn đài & nút Quay thử (Thu gọn) */
    .control-bar {
      background-color: #ebebeb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 8px;
      height: 34px;
      flex-shrink: 0;
      border-bottom: 1px solid #dcdcdc;
    }

    .station-select {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 13px;
      font-weight: 500;
      width: 62%;
      color: #222;
      outline: none;
    }

    .btn-spin {
      background-color: #f37021;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-width: 100px;
      text-align: center;
    }

    .btn-spin.spinning {
      background-color: #d9430f;
    }

    /* Tiêu đề chính (Thu gọn khoảng trống) */
    .title-area {
      background-color: #fff;
      text-align: center;
      padding: 2px 0;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }

    .title-area h1 {
      color: #d32f2f;
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.15;
    }

    .title-area p {
      color: #666;
      font-size: 10.5px;
      line-height: 1.1;
    }

    /* Bảng kết quả (Tự động co giãn khít 100% chiều cao còn lại) */
    .table-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .table-header {
      display: flex;
      background-color: #f5f5f5;
      border-bottom: 1px solid #ccc;
      height: 24px;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 13px;
      color: #111;
    }

    .col-giai {
      width: 10%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #e0e0e0;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      background-color: #fafafa;
      flex-shrink: 0;
    }

    .col-station {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #e0e0e0;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    .col-station:last-child {
      border-right: none;
    }

    .table-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .prize-row {
      display: flex;
      border-bottom: 1px solid #e0e0e0;
      width: 100%;
      min-height: 0;
    }

    /* Chia tỷ lệ chiều cao ngắn gọn, ưu tiên Giải 8 và ĐB rõ ràng */
    .row-g8 { flex: 1.05; }
    .row-g7 { flex: 1; }
    .row-g6 { flex: 2.85; }
    .row-g5 { flex: 1; }
    .row-g4 { flex: 6.4; }
    .row-g3 { flex: 1.9; }
    .row-g2 { flex: 1; }
    .row-g1 { flex: 1; }
    .row-db { flex: 1.15; border-bottom: none; }

    /* Ô chứa con số: Chữ to và đậm hơn */
    .num-cell {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(15px, 2.55vh, 21px);
      font-weight: 700;
      color: #111;
      letter-spacing: 0.3px;
      line-height: 1;
    }

    /* Khi hiển thị 4 đài (Thứ 7), tự động cân chỉnh cỡ chữ vừa cột */
    .mode-4-cols .num-cell {
      font-size: clamp(13.5px, 2.3vh, 18px);
      letter-spacing: 0px;
    }
    .mode-4-cols .table-header {
      font-size: 12px;
    }

    /* Chữ đỏ nổi bật cho Giải 8 và Giải Đặc Biệt */
    .row-g8 .num-cell,
    .row-db .num-cell,
    .row-db .col-giai {
      color: #d32f2f;
      font-size: clamp(16px, 2.7vh, 22px);
    }

    .mode-4-cols .row-db .num-cell {
      font-size: clamp(14px, 2.4vh, 19px);
    }

    /* Hiệu ứng nền vàng khi đang quay */
    .num-cell.active-spin {
      background-color: #fff176;
    }

    /* Thanh lọc chế độ xem (Đầy đủ / 2 Số / 3 Số) luôn nằm gọn ở đáy */
    .footer-bar {
      background-color: #f9f9f9;
      border-top: 1px solid #ccc;
      height: 30px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 500;
      color: #222;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .radio-label input[type="radio"] {
      accent-color: #0b4a92;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Thanh tiêu đề -->
  <div class="app-bar">
    <span class="back-btn">&#8592;</span>
    <span>Quay thử</span>
  </div>

  <!-- Thanh điều khiển -->
  <div class="control-bar">
    <select id="daySelect" class="station-select" onchange="changeDay()">
      <option value="t6">Thứ 6 (Vĩnh Long, Bình Dương, Trà Vinh)</option>
      <option value="t7_3">Thứ 7 (TP.HCM, Long An, Hậu Giang)</option>
      <option value="t7_4">Thứ 7 - 4 Đài (HCM, Long An, B.Phước, Hậu Giang)</option>
      <option value="cn">Chủ Nhật (Tiền Giang, Kiên Giang, Đà Lạt)</option>
      <option value="t2">Thứ 2 (TP.HCM, Đồng Tháp, Cà Mau)</option>
      <option value="t3">Thứ 3 (Bến Tre, Vũng Tàu, Bạc Liêu)</option>
      <option value="t4">Thứ 4 (Đồng Nai, Cần Thơ, Sóc Trăng)</option>
      <option value="t5">Thứ 5 (Tây Ninh, An Giang, Bình Thuận)</option>
    </select>
    <button id="spinBtn" class="btn-spin" onclick="toggleSpin()">QUAY THỬ</button>
  </div>

  <!-- Tiêu đề bảng -->
  <div class="title-area">
    <h1>Tham khảo Xổ Số miền Nam</h1>
    <p>Thông tin chỉ mang tính tham khảo</p>
  </div>

  <!-- Bảng kết quả -->
  <div class="table-wrapper" id="tableWrapper">
    <div class="table-header" id="tableHeader">
      <!-- Tiêu đề đài được tạo tự động -->
    </div>
    <div class="table-body" id="tableBody">
      <!-- Các hàng giải được tạo tự động -->
    </div>
  </div>

  <!-- Tùy chọn hiển thị -->
  <div class="footer-bar">
    <label class="radio-label">
      <input type="radio" name="viewMode" value="all" checked onchange="updateDisplayMode()"> Đầy đủ
    </label>
    <label class="radio-label">
      <input type="radio" name="viewMode" value="2" onchange="updateDisplayMode()"> 2 Số
    </label>
    <label class="radio-label">
      <input type="radio" name="viewMode" value="3" onchange="updateDisplayMode()"> 3 Số
    </label>
  </div>

  <script>
    const prizeConfig = [
      { label: '8', class: 'row-g8', count: 1, digits: 2 },
      { label: '7', class: 'row-g7', count: 1, digits: 3 },
      { label: '6', class: 'row-g6', count: 3, digits: 4 },
      { label: '5', class: 'row-g5', count: 1, digits: 4 },
      { label: '4', class: 'row-g4', count: 7, digits: 5 },
      { label: '3', class: 'row-g3', count: 2, digits: 5 },
      { label: '2', class: 'row-g2', count: 1, digits: 5 },
      { label: '1', class: 'row-g1', count: 1, digits: 5 },
      { label: 'ĐB', class: 'row-db', count: 1, digits: 6 }
    ];

    const stationSchedules = {
      t6: ['Vĩnh Long', 'Bình Dương', 'Trà Vinh'],
      t7_3: ['TP.HCM', 'Long An', 'Hậu Giang'],
      t7_4: ['TP.HCM', 'Long An', 'Bình Phước', 'Hậu Giang'],
      cn: ['Tiền Giang', 'Kiên Giang', 'Đà Lạt'],
      t2: ['TP.HCM', 'Đồng Tháp', 'Cà Mau'],
      t3: ['Bến Tre', 'Vũng Tàu', 'Bạc Liêu'],
      t4: ['Đồng Nai', 'Cần Thơ', 'Sóc Trăng'],
      t5: ['Tây Ninh', 'An Giang', 'Bình Thuận']
    };

    let currentStations = stationSchedules.t6;
    let isSpinning = false;
    let spinTimeout = null;
    let animInterval = null;
    let totalSteps = 0;

    function initTable() {
      const wrapper = document.getElementById('tableWrapper');
      const thead = document.getElementById('tableHeader');
      const tbody = document.getElementById('tableBody');

      // Tự động chỉnh class nếu là 4 đài Thứ 7
      if (currentStations.length === 4) {
        wrapper.classList.add('mode-4-cols');
      } else {
        wrapper.classList.remove('mode-4-cols');
      }

      // Tạo Header tên đài
      thead.innerHTML = '<div class="col-giai">Giải</div>';
      currentStations.forEach((stName) => {
        const div = document.createElement('div');
        div.className = 'col-station';
        div.textContent = stName;
        thead.appendChild(div);
      });

      // Tạo các hàng giải
      tbody.innerHTML = '';
      let stepIndex = 0;

      prizeConfig.forEach(prize => {
        const row = document.createElement('div');
        row.className = `prize-row ${prize.class}`;

        const colGiai = document.createElement('div');
        colGiai.className = 'col-giai';
        colGiai.textContent = prize.label;
        row.appendChild(colGiai);

        for (let s = 0; s < currentStations.length; s++) {
          const colSt = document.createElement('div');
          colSt.className = 'col-station';

          for (let c = 0; c < prize.count; c++) {
            const cell = document.createElement('div');
            cell.className = 'num-cell';
            cell.id = `cell-s${s}-step${stepIndex + c}`;
            cell.dataset.digits = prize.digits;
            cell.dataset.fullval = '';
            cell.textContent = '•••';
            colSt.appendChild(cell);
          }
          row.appendChild(colSt);
        }

        stepIndex += prize.count;
        tbody.appendChild(row);
      });

      totalSteps = stepIndex;
    }

    function randomNum(digits) {
      let res = '';
      for (let i = 0; i < digits; i++) {
        res += Math.floor(Math.random() * 10);
      }
      return res;
    }

    function formatByMode(val) {
      if (!val) return '•••';
      const mode = document.querySelector('input[name="viewMode"]:checked').value;
      if (mode === '2') return val.slice(-2);
      if (mode === '3') return val.slice(-3);
      return val;
    }

    function updateDisplayMode() {
      document.querySelectorAll('.num-cell').forEach(cell => {
        if (cell.dataset.fullval) {
          cell.textContent = formatByMode(cell.dataset.fullval);
        }
      });
    }

    function changeDay() {
      if (isSpinning) stopSpin();
      const val = document.getElementById('daySelect').value;
      currentStations = stationSchedules[val];
      initTable();
    }

    function resetBoard() {
      document.querySelectorAll('.num-cell').forEach(cell => {
        cell.classList.remove('active-spin');
        cell.dataset.fullval = '';
        cell.textContent = '•••';
      });
    }

    function toggleSpin() {
      if (isSpinning) {
        stopSpin();
      } else {
        startSpin();
      }
    }

    function startSpin() {
      isSpinning = true;
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'DỪNG';
      btn.classList.add('spinning');
      resetBoard();
      runStep(0);
    }

    function stopSpin() {
      isSpinning = false;
      clearTimeout(spinTimeout);
      clearInterval(animInterval);
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'QUAY THỬ';
      btn.classList.remove('spinning');
      document.querySelectorAll('.num-cell.active-spin').forEach(c => {
        c.classList.remove('active-spin');
      });
    }

    function runStep(step) {
      if (!isSpinning || step >= totalSteps) {
        stopSpin();
        return;
      }

      const currentCells = [];
      for (let s = 0; s < currentStations.length; s++) {
        currentCells.push(document.getElementById(`cell-s${s}-step${step}`));
      }

      const digits = parseInt(currentCells[0].dataset.digits, 10);
      currentCells.forEach(cell => cell.classList.add('active-spin'));

      animInterval = setInterval(() => {
        currentCells.forEach(cell => {
          cell.textContent = formatByMode(randomNum(digits));
        });
      }, 60);

      spinTimeout = setTimeout(() => {
        clearInterval(animInterval);
        currentCells.forEach(cell => {
          const finalVal = randomNum(digits);
          cell.dataset.fullval = finalVal;
          cell.textContent = formatByMode(finalVal);
          cell.classList.remove('active-spin');
        });
        runStep(step + 1);
      }, 850);
    }

    initTable();
  </script>
</body>
</html>
