<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tham khảo Xổ Số miền Nam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #f5f5f5;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Thanh tiêu đề trên cùng */
    .app-bar {
      background-color: #0b4a92;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 12px;
      height: 40px;
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 500;
    }

    .app-bar .back-btn {
      margin-right: 14px;
      font-size: 18px;
      cursor: pointer;
    }

    /* Thanh chọn đài & nút Quay thử */
    .control-bar {
      background-color: #ebebeb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 10px;
      height: 42px;
      flex-shrink: 0;
      border-bottom: 1px solid #dcdcdc;
    }

    .station-select {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 14px;
      width: 55%;
      color: #333;
      outline: none;
    }

    .btn-spin {
      background-color: #f37021;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      min-width: 115px;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-spin.spinning {
      background-color: #e0530c;
    }

    /* Tiêu đề chính */
    .title-area {
      background-color: #fff;
      text-align: center;
      padding: 4px 0;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }

    .title-area h1 {
      color: #d32f2f;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
    }

    .title-area p {
      color: #555;
      font-size: 11.5px;
      margin-top: 1px;
    }

    /* Bảng kết quả (co giãn tự động vừa màn hình) */
    .table-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #fff;
      overflow: hidden;
    }

    .table-header {
      display: flex;
      background-color: #fafafa;
      border-bottom: 1px solid #ddd;
      height: 28px;
      flex-shrink: 0;
      font-weight: 600;
      font-size: 13px;
      color: #222;
    }

    .col-giai {
      width: 12%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #e5e5e5;
      font-size: 13px;
      color: #333;
      background-color: #f7f7f7;
    }

    .col-station {
      width: 29.333%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #e5e5e5;
      text-align: center;
    }

    .col-station:last-child {
      border-right: none;
    }

    .table-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .prize-row {
      display: flex;
      border-bottom: 1px solid #e5e5e5;
      width: 100%;
    }

    /* Chia tỷ lệ chiều cao theo đúng số lượng hàng của từng giải (tổng 18 lô) */
    .row-g8 { flex: 1; }
    .row-g7 { flex: 1; }
    .row-g6 { flex: 3; }
    .row-g5 { flex: 1; }
    .row-g4 { flex: 7; }
    .row-g3 { flex: 2; }
    .row-g2 { flex: 1; }
    .row-g1 { flex: 1; }
    .row-db { flex: 1.15; border-bottom: none; }

    /* Ô chứa từng con số */
    .num-cell {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(12px, 2.2vh, 17px);
      font-weight: 700;
      color: #111;
      letter-spacing: 0.5px;
      line-height: 1;
    }

    /* Màu chữ đỏ cho Giải 8 và Giải Đặc Biệt */
    .row-g8 .num-cell,
    .row-db .num-cell,
    .row-db .col-giai {
      color: #d32f2f;
    }

    /* Hiệu ứng nền vàng khi đang quay tới hàng đó */
    .num-cell.active-spin {
      background-color: #fff176;
    }

    /* Thanh lọc chế độ xem (Đầy đủ / 2 Số / 3 Số) */
    .footer-bar {
      background-color: #fff;
      border-top: 1px solid #ccc;
      height: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 15px;
      font-size: 13.5px;
      color: #222;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .radio-label input[type="radio"] {
      accent-color: #0b4a92;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Thanh tiêu đề -->
  <div class="app-bar">
    <span class="back-btn">&#8592;</span>
    <span>Quay thử</span>
  </div>

  <!-- Thanh điều khiển -->
  <div class="control-bar">
    <select id="daySelect" class="station-select" onchange="changeDay()">
      <option value="t6">Miền Nam (Vĩnh Long, Bình Dương, Trà Vinh)</option>
      <option value="t2">Thứ 2 (TP.HCM, Đồng Tháp, Cà Mau)</option>
      <option value="t3">Thứ 3 (Bến Tre, Vũng Tàu, Bạc Liêu)</option>
      <option value="t4">Thứ 4 (Đồng Nai, Cần Thơ, Sóc Trăng)</option>
      <option value="t5">Thứ 5 (Tây Ninh, An Giang, Bình Thuận)</option>
      <option value="t7">Thứ 7 (TP.HCM, Long An, Bình Phước)</option>
      <option value="cn">Chủ Nhật (Tiền Giang, Kiên Giang, Đà Lạt)</option>
    </select>
    <button id="spinBtn" class="btn-spin" onclick="toggleSpin()">QUAY THỬ</button>
  </div>

  <!-- Tiêu đề bảng -->
  <div class="title-area">
    <h1>Tham khảo Xổ Số miền Nam</h1>
    <p>Thông tin chỉ mang tính tham khảo</p>
  </div>

  <!-- Bảng kết quả 3 đài -->
  <div class="table-wrapper">
    <div class="table-header">
      <div class="col-giai">Giải</div>
      <div class="col-station" id="st-0">Vĩnh Long</div>
      <div class="col-station" id="st-1">Bình Dương</div>
      <div class="col-station" id="st-2">Trà Vinh</div>
    </div>
    <div class="table-body" id="tableBody">
      <!-- Dữ liệu các giải sẽ được khởi tạo bằng JS -->
    </div>
  </div>

  <!-- Tùy chọn hiển thị -->
  <div class="footer-bar">
    <label class="radio-label">
      <input type="radio" name="viewMode" value="all" checked onchange="updateDisplayMode()"> Đầy đủ
    </label>
    <label class="radio-label">
      <input type="radio" name="viewMode" value="2" onchange="updateDisplayMode()"> 2 Số
    </label>
    <label class="radio-label">
      <input type="radio" name="viewMode" value="3" onchange="updateDisplayMode()"> 3 Số
    </label>
  </div>

  <script>
    // Cấu hình các giải Xổ Số Miền Nam (từ Giải 8 đến Đặc Biệt)
    const prizeConfig = [
      { label: '8', class: 'row-g8', count: 1, digits: 2 },
      { label: '7', class: 'row-g7', count: 1, digits: 3 },
      { label: '6', class: 'row-g6', count: 3, digits: 4 },
      { label: '5', class: 'row-g5', count: 1, digits: 4 },
      { label: '4', class: 'row-g4', count: 7, digits: 5 },
      { label: '3', class: 'row-g3', count: 2, digits: 5 },
      { label: '2', class: 'row-g2', count: 1, digits: 5 },
      { label: '1', class: 'row-g1', count: 1, digits: 5 },
      { label: 'ĐB', class: 'row-db', count: 1, digits: 6 }
    ];

    const stationSchedules = {
      t6: ['Vĩnh Long', 'Bình Dương', 'Trà Vinh'],
      t2: ['TP.HCM', 'Đồng Tháp', 'Cà Mau'],
      t3: ['Bến Tre', 'Vũng Tàu', 'Bạc Liêu'],
      t4: ['Đồng Nai', 'Cần Thơ', 'Sóc Trăng'],
      t5: ['Tây Ninh', 'An Giang', 'Bình Thuận'],
      t7: ['TP.HCM', 'Long An', 'Bình Phước'],
      cn: ['Tiền Giang', 'Kiên Giang', 'Đà Lạt']
    };

    let isSpinning = false;
    let spinTimeout = null;
    let animInterval = null;
    let totalSteps = 0; // Tổng 18 hàng từ trên xuống dưới

    // Tạo bảng HTML
    function initTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      let stepIndex = 0;

      prizeConfig.forEach(prize => {
        const row = document.createElement('div');
        row.className = `prize-row ${prize.class}`;

        // Cột tên giải
        const colGiai = document.createElement('div');
        colGiai.className = 'col-giai';
        colGiai.textContent = prize.label;
        row.appendChild(colGiai);

        // 3 cột cho 3 đài
        for (let s = 0; s < 3; s++) {
          const colSt = document.createElement('div');
          colSt.className = 'col-station';

          for (let c = 0; c < prize.count; c++) {
            const cell = document.createElement('div');
            cell.className = 'num-cell';
            cell.id = `cell-s${s}-step${stepIndex + c}`;
            cell.dataset.digits = prize.digits;
            cell.dataset.fullval = '';
            cell.textContent = '•••';
            colSt.appendChild(cell);
          }
          row.appendChild(colSt);
        }

        stepIndex += prize.count;
        tbody.appendChild(row);
      });

      totalSteps = stepIndex; // 18 bước
    }

    // Sinh số ngẫu nhiên theo độ dài chữ số
    function randomNum(digits) {
      let res = '';
      for (let i = 0; i < digits; i++) {
        res += Math.floor(Math.random() * 10);
      }
      return res;
    }

    // Hiển thị số theo chế độ Đầy đủ / 2 Số / 3 Số
    function formatByMode(val) {
      if (!val) return '•••';
      const mode = document.querySelector('input[name="viewMode"]:checked').value;
      if (mode === '2') return val.slice(-2);
      if (mode === '3') return val.slice(-3);
      return val;
    }

    function updateDisplayMode() {
      const cells = document.querySelectorAll('.num-cell');
      cells.forEach(cell => {
        if (cell.dataset.fullval) {
          cell.textContent = formatByMode(cell.dataset.fullval);
        }
      });
    }

    // Đổi lịch đài
    function changeDay() {
      if (isSpinning) stopSpin();
      const val = document.getElementById('daySelect').value;
      const names = stationSchedules[val];
      for (let i = 0; i < 3; i++) {
        document.getElementById(`st-${i}`).textContent = names[i];
      }
      resetBoard();
    }

    // Đặt lại toàn bộ bảng về dấu ba chấm
    function resetBoard() {
      const cells = document.querySelectorAll('.num-cell');
      cells.forEach(cell => {
        cell.classList.remove('active-spin');
        cell.dataset.fullval = '';
        cell.textContent = '•••';
      });
    }

    // Bật / Tắt quay thử
    function toggleSpin() {
      if (isSpinning) {
        stopSpin();
      } else {
        startSpin();
      }
    }

    function startSpin() {
      isSpinning = true;
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'DỪNG';
      btn.classList.add('spinning');
      resetBoard();
      runStep(0);
    }

    function stopSpin() {
      isSpinning = false;
      clearTimeout(spinTimeout);
      clearInterval(animInterval);
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'QUAY THỬ';
      btn.classList.remove('spinning');

      // Xóa nền vàng ở các ô đang quay dở
      document.querySelectorAll('.num-cell.active-spin').forEach(c => {
        c.classList.remove('active-spin');
      });
    }

    // Quay lần lượt từng hàng của cả 3 đài cùng lúc (giống trong video)
    function runStep(step) {
      if (!isSpinning || step >= totalSteps) {
        stopSpin();
        return;
      }

      const currentCells = [
        document.getElementById(`cell-s0-step${step}`),
        document.getElementById(`cell-s1-step${step}`),
        document.getElementById(`cell-s2-step${step}`)
      ];

      const digits = parseInt(currentCells[0].dataset.digits, 10);

      // Bật nền vàng cho hàng đang quay
      currentCells.forEach(cell => cell.classList.add('active-spin'));

      // Hiệu ứng nhảy số liên tục trước khi chốt
      animInterval = setInterval(() => {
        currentCells.forEach(cell => {
          const tempVal = randomNum(digits);
          cell.textContent = formatByMode(tempVal);
        });
      }, 60);

      // Chốt kết quả của hàng hiện tại sau 900ms và chuyển sang hàng kế tiếp
      spinTimeout = setTimeout(() => {
        clearInterval(animInterval);
        currentCells.forEach(cell => {
          const finalVal = randomNum(digits);
          cell.dataset.fullval = finalVal;
          cell.textContent = formatByMode(finalVal);
          cell.classList.remove('active-spin');
        });
        runStep(step + 1);
      }, 900);
    }

    // Khởi tạo bảng khi tải trang
    initTable();
  </script>
</body>
</html>
