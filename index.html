<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tham khảo Xổ Số miền Nam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    /* Khóa chặt khung nhìn trong màn hình thực tế, chống tràn đáy */
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Thanh tiêu đề trên cùng */
    .app-bar {
      background-color: #0b4a92;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      height: 32px;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .app-bar-left {
      display: flex;
      align-items: center;
    }

    .app-bar .back-btn {
      margin-right: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    /* Đèn báo đang ghi hình video */
    .rec-badge {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 8px;
      border-radius: 10px;
      color: #ffeb3b;
      font-weight: 600;
    }

    .rec-badge.recording {
      display: flex;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      background-color: #ff1744;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Thanh chọn đài & nút Quay thử + Tải video */
    .control-bar {
      background-color: #ebebeb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
      padding: 3px 6px;
      height: 34px;
      flex-shrink: 0;
      border-bottom: 1px solid #dcdcdc;
    }

    .station-select {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 3px 4px;
      font-size: 12.5px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      color: #0b4a92;
      outline: none;
    }

    .btn-group {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-spin {
      background-color: #f37021;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      min-width: 86px;
      text-align: center;
    }

    .btn-spin.spinning {
      background-color: #d9430f;
    }

    .btn-download {
      display: none;
      background-color: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn-download.ready {
      display: inline-flex;
    }

    /* Tiêu đề chính */
    .title-area {
      background-color: #fff;
      text-align: center;
      padding: 2px 0;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }

    .title-area h1 {
      color: #d32f2f;
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.15;
    }

    .title-area p {
      color: #666;
      font-size: 10.5px;
      line-height: 1.1;
    }

    /* Bảng kết quả */
    .table-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .table-header {
      display: flex;
      background-color: #f5f5f5;
      border-bottom: 1px solid #ccc;
      height: 24px;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 13px;
      color: #111;
    }

    .col-giai {
      width: 10%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #e0e0e0;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      background-color: #fafafa;
      flex-shrink: 0;
    }

    .col-station {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #e0e0e0;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    .col-station:last-child {
      border-right: none;
    }

    .table-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .prize-row {
      display: flex;
      border-bottom: 1px solid #e0e0e0;
      width: 100%;
      min-height: 0;
    }

    /* Chia tỷ lệ chiều cao ngắn gọn, ưu tiên Giải 8 và ĐB rõ ràng */
    .row-g8 { flex: 1.05; }
    .row-g7 { flex: 1; }
    .row-g6 { flex: 2.85; }
    .row-g5 { flex: 1; }
    .row-g4 { flex: 6.4; }
    .row-g3 { flex: 1.9; }
    .row-g2 { flex: 1; }
    .row-g1 { flex: 1; }
    .row-db { flex: 1.15; border-bottom: none; }

    /* Ô chứa con số: Chữ to và đậm */
    .num-cell {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(15px, 2.55vh, 21px);
      font-weight: 700;
      color: #111;
      letter-spacing: 0.3px;
      line-height: 1;
    }

    /* Khi hiển thị 4 đài (Thứ 7), tự động cân chỉnh cỡ chữ vừa cột */
    .mode-4-cols .num-cell {
      font-size: clamp(13.5px, 2.3vh, 18px);
      letter-spacing: 0px;
    }
    .mode-4-cols .table-header {
      font-size: 12px;
    }

    /* Chữ đỏ nổi bật cho Giải 8 và Giải Đặc Biệt */
    .row-g8 .num-cell,
    .row-db .num-cell,
    .row-db .col-giai {
      color: #d32f2f;
      font-size: clamp(16px, 2.7vh, 22px);
    }

    .mode-4-cols .row-db .num-cell {
      font-size: clamp(14px, 2.4vh, 19px);
    }

    /* Hiệu ứng nền vàng khi đang quay */
    .num-cell.active-spin {
      background-color: #fff176;
    }

    /* Thanh lọc chế độ xem (Đầy đủ / 2 Số / 3 Số) */
    .footer-bar {
      background-color: #f9f9f9;
      border-top: 1px solid #ccc;
      height: 30px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 500;
      color: #222;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .radio-label input[type="radio"] {
      accent-color: #0b4a92;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Thanh tiêu đề -->
  <div class="app-bar">
    <div class="app-bar-left">
      <span class="back-btn">&#8592;</span>
      <span>Quay thử</span>
    </div>
    <div id="recBadge" class="rec-badge">
      <span class="rec-dot"></span>
      <span>ĐANG GHI VIDEO</span>
    </div>
  </div>

  <!-- Thanh điều khiển -->
  <div class="control-bar">
    <select id="daySelect" class="station-select" onchange="changeDay()">
      <!-- Danh sách Hôm nay / Ngày mai và các thứ được tạo tự động -->
    </select>
    <div class="btn-group">
      <button id="spinBtn" class="btn-spin" onclick="toggleSpin()">QUAY THỬ</button>
      <a id="downloadBtn" class="btn-download" href="#" download="quay-thu-xsmn.webm">⬇ TẢI VIDEO</a>
    </div>
  </div>

  <!-- Tiêu đề bảng -->
  <div class="title-area">
    <h1>Tham khảo Xổ Số miền Nam</h1>
    <p id="subTitle">Thông tin chỉ mang tính tham khảo</p>
  </div>

  <!-- Bảng kết quả -->
  <div class="table-wrapper" id="tableWrapper">
    <div class="table-header" id="tableHeader"></div>
    <div class="table-body" id="tableBody"></div>
  </div>

  <!-- Tùy chọn hiển thị -->
  <div class="footer-bar">
    <label class="radio-label">
      <input type="radio" name="viewMode" value="all" checked onchange="updateDisplayMode()"> Đầy đủ
    </label>
    <label class="radio-label">
      <input type="radio" name="viewMode" value="2" onchange="updateDisplayMode()"> 2 Số
    </label>
    <label class="radio-label">
      <input type="radio" name="viewMode" value="3" onchange="updateDisplayMode()"> 3 Số
    </label>
  </div>

  <!-- Canvas ẩn dùng để xuất video chất lượng cao -->
  <canvas id="videoCanvas" width="720" height="1280" style="display:none;"></canvas>

  <script>
    const prizeConfig = [
      { label: '8', class: 'row-g8', count: 1, digits: 2 },
      { label: '7', class: 'row-g7', count: 1, digits: 3 },
      { label: '6', class: 'row-g6', count: 3, digits: 4 },
      { label: '5', class: 'row-g5', count: 1, digits: 4 },
      { label: '4', class: 'row-g4', count: 7, digits: 5 },
      { label: '3', class: 'row-g3', count: 2, digits: 5 },
      { label: '2', class: 'row-g2', count: 1, digits: 5 },
      { label: '1', class: 'row-g1', count: 1, digits: 5 },
      { label: 'ĐB', class: 'row-db', count: 1, digits: 6 }
    ];

    const scheduleByDayIndex = {
      0: { name: 'Chủ Nhật', stations: ['Tiền Giang', 'Kiên Giang', 'Đà Lạt'] },
      1: { name: 'Thứ 2', stations: ['TP.HCM', 'Đồng Tháp', 'Cà Mau'] },
      2: { name: 'Thứ 3', stations: ['Bến Tre', 'Vũng Tàu', 'Bạc Liêu'] },
      3: { name: 'Thứ 4', stations: ['Đồng Nai', 'Cần Thơ', 'Sóc Trăng'] },
      4: { name: 'Thứ 5', stations: ['Tây Ninh', 'An Giang', 'Bình Thuận'] },
      5: { name: 'Thứ 6', stations: ['Vĩnh Long', 'Bình Dương', 'Trà Vinh'] },
      6: { name: 'Thứ 7', stations: ['TP.HCM', 'Long An', 'Bình Phước', 'Hậu Giang'] }
    };

    let currentStations = [];
    let isSpinning = false;
    let activeStep = -1;
    let spinTimeout = null;
    let pauseTimeout = null;
    let animInterval = null;
    let totalSteps = 0;

    // CẤU HÌNH TỐC ĐỘ CHẬM TỪ TỪ (~32 giây cho 18 hàng):
    const TICK_SPEED_MS = 220;    // Tốc độ nhảy từng con số: 220ms
    const STEP_SPIN_MS = 1550;    // Thời gian quay 1 hàng: 1.55 giây
    const STEP_PAUSE_MS = 250;    // Nghỉ 0.25 giây trước khi xuống hàng tiếp theo

    // BIẾN GHI VIDEO
    let mediaRecorder = null;
    let recordedChunks = [];
    let renderLoopId = null;
    let currentVideoUrl = null;

    function initDaySelector() {
      const select = document.getElementById('daySelect');
      select.innerHTML = '';

      const now = new Date();
      const todayIdx = now.getDay();
      const tomorrowIdx = (todayIdx + 1) % 7;

      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const isAfterDraw = currentMinutes >= (16 * 60 + 35);

      const orderedIndices = [todayIdx, tomorrowIdx];
      for (let i = 0; i < 7; i++) {
        if (i !== todayIdx && i !== tomorrowIdx) {
          orderedIndices.push(i);
        }
      }

      orderedIndices.forEach(idx => {
        const info = scheduleByDayIndex[idx];
        const opt = document.createElement('option');
        opt.value = idx;

        let prefix = '';
        if (idx === todayIdx) prefix = '[Hôm nay] ';
        else if (idx === tomorrowIdx) prefix = '[Ngày mai] ';

        opt.textContent = `${prefix}${info.name} (${info.stations.join(', ')})`;
        select.appendChild(opt);
      });

      select.value = isAfterDraw ? tomorrowIdx : todayIdx;
      currentStations = scheduleByDayIndex[select.value].stations;
    }

    function initTable() {
      const wrapper = document.getElementById('tableWrapper');
      const thead = document.getElementById('tableHeader');
      const tbody = document.getElementById('tableBody');

      if (currentStations.length === 4) {
        wrapper.classList.add('mode-4-cols');
      } else {
        wrapper.classList.remove('mode-4-cols');
      }

      thead.innerHTML = '<div class="col-giai">Giải</div>';
      currentStations.forEach((stName) => {
        const div = document.createElement('div');
        div.className = 'col-station';
        div.textContent = stName;
        thead.appendChild(div);
      });

      tbody.innerHTML = '';
      let stepIndex = 0;

      prizeConfig.forEach(prize => {
        const row = document.createElement('div');
        row.className = `prize-row ${prize.class}`;

        const colGiai = document.createElement('div');
        colGiai.className = 'col-giai';
        colGiai.textContent = prize.label;
        row.appendChild(colGiai);

        for (let s = 0; s < currentStations.length; s++) {
          const colSt = document.createElement('div');
          colSt.className = 'col-station';

          for (let c = 0; c < prize.count; c++) {
            const cell = document.createElement('div');
            cell.className = 'num-cell';
            cell.id = `cell-s${s}-step${stepIndex + c}`;
            cell.dataset.digits = prize.digits;
            cell.dataset.fullval = '';
            cell.textContent = '•••';
            colSt.appendChild(cell);
          }
          row.appendChild(colSt);
        }

        stepIndex += prize.count;
        tbody.appendChild(row);
      });

      totalSteps = stepIndex;
    }

    function randomNum(digits) {
      let res = '';
      for (let i = 0; i < digits; i++) {
        res += Math.floor(Math.random() * 10);
      }
      return res;
    }

    function formatByMode(val) {
      if (!val) return '•••';
      const mode = document.querySelector('input[name="viewMode"]:checked').value;
      if (mode === '2') return val.slice(-2);
      if (mode === '3') return val.slice(-3);
      return val;
    }

    function updateDisplayMode() {
      document.querySelectorAll('.num-cell').forEach(cell => {
        if (cell.dataset.fullval) {
          cell.textContent = formatByMode(cell.dataset.fullval);
        }
      });
    }

    function changeDay() {
      if (isSpinning) stopSpin(false);
      const val = document.getElementById('daySelect').value;
      currentStations = scheduleByDayIndex[val].stations;
      document.getElementById('downloadBtn').classList.remove('ready');
      initTable();
    }

    function resetBoard() {
      document.querySelectorAll('.num-cell').forEach(cell => {
        cell.classList.remove('active-spin');
        cell.dataset.fullval = '';
        cell.textContent = '•••';
      });
    }

    // ================= TÍNH NĂNG VẼ & GHI VIDEO TỰ ĐỘNG =================
    function drawVideoFrame() {
      const canvas = document.getElementById('videoCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      // Nền trắng toàn màn hình
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);

      // 1. Vẽ Thanh App Bar trên cùng
      ctx.fillStyle = '#0b4a92';
      ctx.fillRect(0, 0, W, 62);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('←   Quay thử', 24, 31);

      // 2. Vẽ Thanh điều khiển
      ctx.fillStyle = '#ebebeb';
      ctx.fillRect(0, 62, W, 66);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 2;
      ctx.fillRect(16, 72, 460, 46);
      ctx.strokeRect(16, 72, 460, 46);

      const sel = document.getElementById('daySelect');
      const dayText = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text.replace(/\[.*?\]\s*/, '') : '';
      ctx.fillStyle = '#222222';
      ctx.font = '600 22px sans-serif';
      ctx.fillText(dayText.substring(0, 28), 28, 95);

      // Nút DỪNG / QUAY THỬ trong video
      ctx.fillStyle = isSpinning ? '#d9430f' : '#f37021';
      ctx.fillRect(496, 72, 208, 46);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 23px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isSpinning ? 'DỪNG' : 'QUAY THỬ', 600, 95);

      // 3. Vẽ Tiêu đề Tham khảo Xổ Số miền Nam
      ctx.fillStyle = '#d32f2f';
      ctx.font = 'bold 29px sans-serif';
      ctx.fillText('Tham khảo Xổ Số miền Nam', W / 2, 152);
      ctx.fillStyle = '#666666';
      ctx.font = '21px sans-serif';
      ctx.fillText('Thông tin chỉ mang tính tham khảo', W / 2, 180);

      ctx.strokeStyle = '#dddddd';
      ctx.beginPath();
      ctx.moveTo(0, 196);
      ctx.lineTo(W, 196);
      ctx.stroke();

      // 4. Vẽ Header Bảng (Giải + Tên các đài)
      const headerY = 196;
      const headerH = 46;
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, headerY, W, headerH);

      const giaiW = W * 0.11;
      const numStations = currentStations.length;
      const stW = (W - giaiW) / numStations;

      ctx.fillStyle = '#111111';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('Giải', giaiW / 2, headerY + headerH / 2);

      currentStations.forEach((st, i) => {
        ctx.fillText(st, giaiW + i * stW + stW / 2, headerY + headerH / 2);
      });

      ctx.strokeStyle = '#cccccc';
      ctx.beginPath();
      ctx.moveTo(0, headerY + headerH);
      ctx.lineTo(W, headerY + headerH);
      ctx.stroke();

      // 5. Vẽ 18 hàng số từ Giải 8 đến Giải ĐB
      const bodyTop = headerY + headerH;
      const footerH = 56;
      const bodyH = H - bodyTop - footerH;
      const stepH = bodyH / 18;

      let stepIdx = 0;
      prizeConfig.forEach(prize => {
        const rowTop = bodyTop + stepIdx * stepH;
        const rowH = prize.count * stepH;

        // Nền cột Giải
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, rowTop, giaiW, rowH);

        // Chữ cột Giải
        ctx.fillStyle = (prize.label === 'ĐB') ? '#d32f2f' : '#333333';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(prize.label, giaiW / 2, rowTop + rowH / 2);

        // Vẽ từng hàng số của từng đài
        for (let c = 0; c < prize.count; c++) {
          const curStep = stepIdx + c;
          const cellTop = rowTop + c * stepH;

          // Nền vàng nếu đang quay tới hàng này
          if (curStep === activeStep) {
            ctx.fillStyle = '#fff176';
            ctx.fillRect(giaiW, cellTop, W - giaiW, stepH);
          }

          for (let s = 0; s < numStations; s++) {
            const domCell = document.getElementById(`cell-s${s}-step${curStep}`);
            const textVal = domCell ? domCell.textContent : '•••';
            const cellX = giaiW + s * stW + stW / 2;
            const cellY = cellTop + stepH / 2;

            if (prize.label === '8' || prize.label === 'ĐB') {
              ctx.fillStyle = '#d32f2f';
              ctx.font = numStations === 4 ? 'bold 31px sans-serif' : 'bold 36px sans-serif';
            } else {
              ctx.fillStyle = '#111111';
              ctx.font = numStations === 4 ? 'bold 29px sans-serif' : 'bold 33px sans-serif';
            }
            ctx.fillText(textVal, cellX, cellY);
          }
        }

        // Đường kẻ ngang phân cách giải
        ctx.strokeStyle = '#dcdcdc';
        ctx.beginPath();
        ctx.moveTo(0, rowTop + rowH);
        ctx.lineTo(W, rowTop + rowH);
        ctx.stroke();

        stepIdx += prize.count;
      });

      // Đường kẻ dọc phân cách các cột đài
      ctx.strokeStyle = '#dcdcdc';
      ctx.beginPath();
      ctx.moveTo(giaiW, headerY);
      ctx.lineTo(giaiW, H - footerH);
      for (let s = 1; s < numStations; s++) {
        const x = giaiW + s * stW;
        ctx.moveTo(x, headerY);
        ctx.lineTo(x, H - footerH);
      }
      ctx.stroke();

      // 6. Vẽ Thanh Footer (Đầy đủ / 2 Số / 3 Số)
      const footerTop = H - footerH;
      ctx.fillStyle = '#f9f9f9';
      ctx.fillRect(0, footerTop, W, footerH);
      ctx.strokeStyle = '#cccccc';
      ctx.beginPath();
      ctx.moveTo(0, footerTop);
      ctx.lineTo(W, footerTop);
      ctx.stroke();

      const mode = document.querySelector('input[name="viewMode"]:checked').value;
      const opts = [
        { k: 'all', l: 'Đầy đủ', x: W * 0.2 },
        { k: '2', l: '2 Số', x: W * 0.5 },
        { k: '3', l: '3 Số', x: W * 0.8 }
      ];

      opts.forEach(o => {
        const cy = footerTop + footerH / 2;
        ctx.strokeStyle = '#0b4a92';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(o.x - 45, cy, 11, 0, Math.PI * 2);
        ctx.stroke();

        if (mode === o.k) {
          ctx.fillStyle = '#0b4a92';
          ctx.beginPath();
          ctx.arc(o.x - 45, cy, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#222222';
        ctx.font = '500 23px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(o.l, o.x - 26, cy);
      });
    }

    function startVideoRecording() {
      const canvas = document.getElementById('videoCanvas');
      if (!canvas.captureStream || typeof MediaRecorder === 'undefined') return;

      const dlBtn = document.getElementById('downloadBtn');
      dlBtn.classList.remove('ready');
      if (currentVideoUrl) {
        URL.revokeObjectURL(currentVideoUrl);
        currentVideoUrl = null;
      }

      drawVideoFrame();
      const stream = canvas.captureStream(30); // 30 FPS mượt mà
      recordedChunks = [];

      // Ưu tiên định dạng MP4 hoặc WebM tùy thiết bị hỗ trợ
      const mimeTypes = [
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      let selectedMime = '';
      for (const m of mimeTypes) {
        if (MediaRecorder.isTypeSupported(m)) {
          selectedMime = m;
          break;
        }
      }

      try {
        mediaRecorder = selectedMime
          ? new MediaRecorder(stream, { mimeType: selectedMime, videoBitsPerSecond: 2500000 })
          : new MediaRecorder(stream);
      } catch (e) {
        return;
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: selectedMime || 'video/webm' });
        currentVideoUrl = URL.createObjectURL(blob);
        const ext = (selectedMime && selectedMime.includes('mp4')) ? 'mp4' : 'webm';
        const fileName = `quay-thu-xsmn-${Date.now()}.${ext}`;

        dlBtn.href = currentVideoUrl;
        dlBtn.download = fileName;
        dlBtn.classList.add('ready');

        // Tự động tải video về máy khi quay xong
        dlBtn.click();
      };

      mediaRecorder.start(200);
      document.getElementById('recBadge').classList.add('recording');

      function loop() {
        drawVideoFrame();
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          renderLoopId = requestAnimationFrame(loop);
        }
      }
      loop();
    }

    function stopVideoRecording() {
      document.getElementById('recBadge').classList.remove('recording');
      if (renderLoopId) {
        cancelAnimationFrame(renderLoopId);
        renderLoopId = null;
      }
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }
    // =====================================================================

    function toggleSpin() {
      if (isSpinning) {
        stopSpin(true);
      } else {
        startSpin();
      }
    }

    function startSpin() {
      isSpinning = true;
      activeStep = 0;
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'DỪNG';
      btn.classList.add('spinning');
      resetBoard();
      startVideoRecording();
      runStep(0);
    }

    function stopSpin(saveVideo = true) {
      isSpinning = false;
      activeStep = -1;
      clearTimeout(spinTimeout);
      clearTimeout(pauseTimeout);
      clearInterval(animInterval);
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'QUAY THỬ';
      btn.classList.remove('spinning');
      document.querySelectorAll('.num-cell.active-spin').forEach(c => {
        c.classList.remove('active-spin');
      });

      if (saveVideo) {
        // Vẽ thêm 1.5 giây bảng kết quả cuối cùng vào video trước khi xuất file
        drawVideoFrame();
        setTimeout(() => {
          stopVideoRecording();
        }, 1500);
      } else {
        stopVideoRecording();
      }
    }

    function runStep(step) {
      if (!isSpinning || step >= totalSteps) {
        stopSpin(true);
        return;
      }

      activeStep = step;
      const currentCells = [];
      for (let s = 0; s < currentStations.length; s++) {
        currentCells.push(document.getElementById(`cell-s${s}-step${step}`));
      }

      const digits = parseInt(currentCells[0].dataset.digits, 10);

      currentCells.forEach(cell => {
        cell.classList.add('active-spin');
        cell.textContent = formatByMode(randomNum(digits));
      });

      animInterval = setInterval(() => {
        currentCells.forEach(cell => {
          cell.textContent = formatByMode(randomNum(digits));
        });
      }, TICK_SPEED_MS);

      spinTimeout = setTimeout(() => {
        clearInterval(animInterval);
        currentCells.forEach(cell => {
          const finalVal = randomNum(digits);
          cell.dataset.fullval = finalVal;
          cell.textContent = formatByMode(finalVal);
          cell.classList.remove('active-spin');
        });
        activeStep = -1;

        pauseTimeout = setTimeout(() => {
          runStep(step + 1);
        }, STEP_PAUSE_MS);
      }, STEP_SPIN_MS);
    }

    // Khởi chạy ứng dụng
    initDaySelector();
    initTable();
  </script>
</body>
