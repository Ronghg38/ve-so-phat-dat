<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vé Số Phát Đạt</title>

<style>
*{box-sizing:border-box}

:root{
  --red:#d0021b;
  --blue:#1743a5;
  --border:#d9d9d9;
  --bg:#eef0f2;
}

html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:#111;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  max-width:700px;
  min-height:100vh;
  margin:0 auto;
  background:#fff;
}

/* HEADER */
header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 15px;
  background:#fff;
}

.menu{
  width:40px;
  font-size:25px;
  color:#555;
  cursor:pointer;
}

.menu:last-child{text-align:right}

.logo{
  text-align:center;
  color:var(--red);
  font-size:20px;
  font-weight:bold;
  line-height:1.05;
}

.logo small{
  display:block;
  margin-top:5px;
  color:#444;
  font-size:10px;
  font-weight:normal;
}

/* MIỀN */
.region-nav{
  display:flex;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.region-nav button{
  flex:1;
  min-width:0;
  padding:12px 2px;
  border:0;
  border-right:1px solid var(--border);
  background:#fff;
  color:#0056b3;
  font-weight:bold;
  font-size:13px;
  cursor:pointer;
}

.region-nav button:last-child{border-right:0}
.region-nav button.active{color:var(--red)}

/* NGÀY */
.day-nav{
  display:flex;
  justify-content:space-around;
  padding:8px 3px;
  background:#fafafa;
  border-bottom:1px solid var(--border);
}

.day-nav button{
  border:0;
  background:none;
  padding:5px 7px;
  font-size:14px;
  cursor:pointer;
}

.day-nav button.active{
  color:var(--red);
  font-weight:bold;
}

/* ĐÀI */
.station-nav{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:9px 10px;
  border-bottom:1px solid var(--border);
  background:#fff;
  scrollbar-width:none;
}
.station-nav::-webkit-scrollbar{display:none}

.station-nav button{
  flex:none;
  border:1px solid #ccc;
  background:#fff;
  border-radius:4px;
  padding:7px 11px;
  font-size:13px;
  cursor:pointer;
}

.station-nav button.active{
  background:var(--red);
  color:#fff;
  border-color:var(--red);
}

/* ALERT */
.alert{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  padding:9px;
  color:#555;
  font-size:13px;
}

.alert a{
  background:var(--red);
  color:#fff;
  text-decoration:none;
  padding:5px 11px;
  border-radius:4px;
  font-size:12px;
}

/* TITLE */
.title{
  background:var(--red);
  color:#fff;
  padding:11px 14px;
  font-size:18px;
  font-weight:bold;
}

.breadcrumb{
  padding:12px 10px;
  font-size:16px;
  font-weight:bold;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.breadcrumb span{
  color:#7d1515;
  text-decoration:underline;
}

/* THÔNG TIN ĐÀI */
.station-info{
  padding:10px 14px;
  background:#fff8f8;
  color:var(--red);
  font-weight:bold;
  border-bottom:1px solid #eee;
}

/* TABLE */
.result-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  text-align:center;
  background:#fff;
}

.result-table th,
.result-table td{
  border:1px solid var(--border);
  padding:8px 2px;
  vertical-align:middle;
}

.result-table th{
  color:var(--blue);
  font-size:17px;
  height:54px;
}

.result-table .prize{
  width:15%;
  background:#fafafa;
  color:#333;
  font-size:16px;
  font-weight:normal;
}

.result-table .num{
  font-size:31px;
  font-weight:700;
  line-height:1.65;
  letter-spacing:-.5px;
  overflow-wrap:anywhere;
}

.result-table .db{
  color:var(--red);
  font-size:42px;
  line-height:1.25;
}

/* XSMN/XSMT: một đài */
.result-table.single .num{
  font-size:40px;
}
.result-table.single .db{
  font-size:44px;
}

/* XSMN/XSMT: nhiều đài */
.result-table.multi .num{
  font-size:28px;
  line-height:1.65;
}
.result-table.multi .db{
  font-size:31px;
}

/* Các cụm số trong một ô */
.numbers{
  display:grid;
  gap:4px 6px;
  align-items:center;
  justify-items:center;
}

.numbers.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.numbers.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.numbers.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}

.stack{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}

/* XSMB */
.result-table.mb .num{
  font-size:31px;
  line-height:1.65;
}

.result-table.mb .db{
  font-size:44px;
  color:var(--red);
}

.result-table.mb .code-row td{
  color:#4932a5;
  font-size:27px;
  font-weight:normal;
  letter-spacing:0;
}

.result-table.mb .code-label{
  color:#333;
  font-size:16px;
}

.result-table.mb .g3 .numbers,
.result-table.mb .g5 .numbers{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.result-table.mb .g4 .numbers{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.result-table.mb .g6 .numbers{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.result-table.mb .g7 .numbers{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.result-table.mb .g2 .numbers{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

/* THỐNG KÊ */
.statistics{
  display:none;
  padding-bottom:20px;
}

.stat-box{
  margin:10px;
  border:1px solid #ddd;
  border-radius:5px;
  overflow:hidden;
}

.stat-title{
  background:var(--red);
  color:white;
  padding:9px;
  font-weight:bold;
}

.stat-body{
  padding:10px;
  line-height:1.8;
}

.tag{
  display:inline-block;
  background:#f1f1f1;
  padding:3px 8px;
  margin:2px;
  border-radius:4px;
  font-weight:bold;
}

/* FOOTER */
.footer{
  padding:18px;
  text-align:center;
  color:#777;
  font-size:12px;
  border-top:1px solid var(--border);
}

/* MOBILE */
@media (max-width:520px){
  .title{font-size:16px}
  .breadcrumb{font-size:15px}
  .result-table th{font-size:14px;height:48px}
  .result-table .prize{font-size:14px}
  .result-table.single .num{font-size:34px}
  .result-table.single .db{font-size:40px}
  .result-table.multi .num{font-size:22px}
  .result-table.multi .db{font-size:25px}
  .result-table.mb .num{font-size:25px}
  .result-table.mb .db{font-size:38px}
  .result-table.mb .code-row td{font-size:21px}
}

@media (max-width:380px){
  .result-table.multi .num{font-size:19px}
  .result-table.mb .num{font-size:22px}
  .result-table.mb .code-row td{font-size:18px}
  .result-table.single .num{font-size:30px}
  .result-table.single .db{font-size:36px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="menu">☰</div>
  <div class="logo">
    Vé Số<br>PHÁT ĐẠT
    <small>Chính xác từng giây</small>
  </div>
  <div class="menu">👤</div>
</header>

<nav class="region-nav">
  <button data-region="mb">XSMB</button>
  <button data-region="mn" class="active">XSMN</button>
  <button data-region="mt">XSMT</button>
  <button data-region="stat">Thống kê</button>
</nav>

<nav class="day-nav">
  <button data-day="T2">T2</button>
  <button data-day="T3">T3</button>
  <button data-day="T4">T4</button>
  <button data-day="T5">T5</button>
  <button data-day="T6">T6</button>
  <button data-day="T7">T7</button>
  <button data-day="CN">CN</button>
</nav>

<div class="station-nav" id="stationNav"></div>

<div id="mainContent">
  <div class="alert">
    <span id="alertText">Kết quả xổ số mới nhất 👍</span>
    <a href="#">Xem ngay</a>
  </div>

  <div class="title" id="pageTitle"></div>

  <div class="breadcrumb">
    <span id="breadcrumbRegion"></span>
    »
    <span id="breadcrumbDay"></span>
    »
    <span id="dateText"></span>
  </div>

  <div class="station-info" id="stationInfo"></div>

  <table class="result-table" id="resultTable">
    <thead><tr id="tableHead"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="statistics" id="statistics">
  <div class="title">Thống kê XSMN</div>

  <div class="stat-box">
    <div class="stat-title">Đầu</div>
    <div class="stat-body">
      <span class="tag">0</span><span class="tag">1</span><span class="tag">2</span>
      <span class="tag">3</span><span class="tag">4</span><span class="tag">5</span>
      <span class="tag">6</span><span class="tag">7</span><span class="tag">8</span>
      <span class="tag">9</span>
    </div>
  </div>

  <div class="stat-box">
    <div class="stat-title">Đuôi</div>
    <div class="stat-body">
      <span class="tag">0</span><span class="tag">1</span><span class="tag">2</span>
      <span class="tag">3</span><span class="tag">4</span><span class="tag">5</span>
      <span class="tag">6</span><span class="tag">7</span><span class="tag">8</span>
      <span class="tag">9</span>
    </div>
  </div>

  <div class="stat-box">
    <div class="stat-title">Cặp số tham khảo</div>
    <div class="stat-body">
      <span class="tag">12</span><span class="tag">21</span>
      <span class="tag">36</span><span class="tag">63</span>
      <span class="tag">68</span><span class="tag">86</span>
    </div>
  </div>
</div>

<div class="footer">
  Vé Số Phát Đạt © 2026<br>
  Dữ liệu hiển thị nhằm mục đích tham khảo.
</div>

</div>

<script>
/* =========================
   DANH SÁCH ĐÀI
========================= */
const MN={
  T2:["TPHCM","Đồng Tháp","Cà Mau"],
  T3:["Bến Tre","Vũng Tàu","Bạc Liêu"],
  T4:["Đồng Nai","Cần Thơ","Sóc Trăng"],
  T5:["Tây Ninh","An Giang","Bình Thuận"],
  T6:["Bình Dương","Vĩnh Long","Trà Vinh"],
  T7:["TPHCM","Long An","Bình Phước","Hậu Giang"],
  CN:["Tiền Giang","Kiên Giang","Đà Lạt"]
};

const MT={
  T2:["Phú Yên","Thừa Thiên Huế"],
  T3:["Quảng Nam","Đắk Lắk"],
  T4:["Đà Nẵng","Khánh Hòa"],
  T5:["Bình Định","Quảng Bình","Quảng Trị"],
  T6:["Gia Lai","Ninh Thuận"],
  T7:["Đà Nẵng","Quảng Ngãi","Đắk Nông"],
  CN:["Kon Tum","Khánh Hòa"]
};

const MB=["Hà Nội"];

const dayName={
  T2:"Thứ 2",T3:"Thứ 3",T4:"Thứ 4",
  T5:"Thứ 5",T6:"Thứ 6",T7:"Thứ 7",CN:"Chủ nhật"
};

let currentRegion="mn";
let currentDay="T2";
let currentStation=-1;

/* =========================
   DỮ LIỆU MẪU MIỀN NAM/TRUNG
   Mỗi đài có đúng cơ cấu:
   G8:1, G7:1, G6:3, G5:1,
   G4:7, G3:2, G2:1, G1:1, DB:1
========================= */
function createSouthNumbers(index){
  const seed=1000+index*1234;

  const n=(value,len)=>String(value).padStart(len,"0").slice(-len);

  return {
    G8:[n(10+index,2)],
    G7:[n(200+index*111,3)],
    G6:[n(seed,4),n(seed+111,4),n(seed+222,4)],
    G5:[n(seed+333,4)],
    G4:[
      n(seed+444,5),n(seed+555,5),n(seed+666,5),
      n(seed+777,5),n(seed+888,5),n(seed+999,5),
      n(seed+1111,5)
    ],
    G3:[n(seed+123,5),n(seed+456,5)],
    G2:[n(seed+2222,5)],
    G1:[n(seed+3333,5)],
    DB:[n(400000+index*12345,6)]
  };
}

/* =========================
   DỮ LIỆU MẪU MIỀN BẮC
========================= */
function createNorthNumbers(){
  return {
    codes:["2GU","4GU","6GU","5GU","7GU","9GU"],
    DB:["78196"],
    G1:["91282"],
    G2:["68753","84293"],
    G3:["26364","94735","53485","04606","35704","61416"],
    G4:["3789","5569","2524","0483"],
    G5:["1399","2321","1121","8155","9803","9490"],
    G6:["970","276","920"],
    G7:["40","28","16","11"]
  };
}

/* =========================
   LẤY ĐÀI
========================= */
function getStations(){
  if(currentRegion==="mn") return MN[currentDay]||[];
  if(currentRegion==="mt") return MT[currentDay]||[];
  if(currentRegion==="mb") return MB;
  return [];
}

/* =========================
   NÚT ĐÀI
========================= */
function renderStationButtons(){
  const box=document.getElementById("stationNav");
  const stations=getStations();

  box.innerHTML="";

  /* XSMB chỉ có một bảng, không cần thanh chọn đài */
  if(currentRegion==="mb"){
    box.style.display="none";
    return;
  }

  if(!stations.length){
    box.style.display="none";
    return;
  }

  box.style.display="flex";

  const all=document.createElement("button");
  all.textContent="Tất cả";
  if(currentStation===-1) all.classList.add("active");

  all.onclick=()=>{
    currentStation=-1;
    renderStationButtons();
    renderTable();
  };

  box.appendChild(all);

  stations.forEach((station,index)=>{
    const btn=document.createElement("button");
    btn.textContent=station;

    if(currentStation===index) btn.classList.add("active");

    btn.onclick=()=>{
      currentStation=index;
      renderStationButtons();
      renderTable();
    };

    box.appendChild(btn);
  });
}

/* =========================
   HEADER BẢNG
========================= */
function renderTableHead(){
  const head=document.getElementById("tableHead");
  const stations=getStations();

  if(currentRegion==="mb"){
    head.innerHTML=`<th class="prize">Giải</th><th>Hà Nội</th>`;
    return;
  }

  let html=`<th class="prize">Giải</th>`;

  if(currentStation===-1){
    stations.forEach(station=>{
      html+=`<th>${station}</th>`;
    });
  }else{
    html+=`<th>${stations[currentStation]}</th>`;
  }

  head.innerHTML=html;
}

/* =========================
   Ô SỐ
========================= */
function numberCell(value,isDB=false){
  return `<td class="num${isDB?" db":""}">${value}</td>`;
}

function groupNumbers(values,cols){
  return `<div class="numbers cols-${cols}">
    ${values.map(v=>`<span>${v}</span>`).join("")}
  </div>`;
}

/* =========================
   BẢNG XSMN/XSMT
========================= */
function renderSouthTable(){
  const stations=getStations();
  const selected=currentStation===-1
    ? stations.map((_,i)=>i)
    : [currentStation];

  const data=selected.map(i=>createSouthNumbers(i));
  const table=document.getElementById("resultTable");

  table.className="result-table "+(selected.length===1?"single":"multi");

  let html="";

  html+=`<tr><td class="prize">G.8</td>
    ${data.map(x=>numberCell(x.G8[0],true)).join("")}</tr>`;

  html+=`<tr><td class="prize">G.7</td>
    ${data.map(x=>numberCell(x.G7[0])).join("")}</tr>`;

  html+=`<tr><td class="prize">G.6</td>
    ${data.map(x=>`<td class="num">${x.G6.join("<br>")}</td>`).join("")}</tr>`;

  html+=`<tr><td class="prize">G.5</td>
    ${data.map(x=>numberCell(x.G5[0])).join("")}</tr>`;

  html+=`<tr><td class="prize">G.4</td>
    ${data.map(x=>`<td class="num">${x.G4.join("<br>")}</td>`).join("")}</tr>`;

  html+=`<tr><td class="prize">G.3</td>
    ${data.map(x=>`<td class="num">${x.G3.join("<br>")}</td>`).join("")}</tr>`;

  html+=`<tr><td class="prize">G.2</td>
    ${data.map(x=>numberCell(x.G2[0])).join("")}</tr>`;

  html+=`<tr><td class="prize">G.1</td>
    ${data.map(x=>numberCell(x.G1[0])).join("")}</tr>`;

  html+=`<tr><td class="prize">ĐB</td>
    ${data.map(x=>numberCell(x.DB[0],true)).join("")}</tr>`;

  document.getElementById("tableBody").innerHTML=html;
}

/* =========================
   BẢNG XSMB
========================= */
function renderNorthTable(){
  const d=createNorthNumbers();
  const table=document.getElementById("resultTable");
  table.className="result-table mb";

  let html="";

  html+=`
    <tr class="code-row">
      <td class="prize code-label">Mã ĐB</td>
      <td>${d.codes.join("&nbsp;&nbsp;")}</td>
    </tr>`;

  html+=`
    <tr>
      <td class="prize">G.ĐB</td>
      <td class="num db">${d.DB[0]}</td>
    </tr>`;

  html+=`
    <tr>
      <td class="prize">G.1</td>
      <td class="num">${d.G1[0]}</td>
    </tr>`;

  html+=`
    <tr>
      <td class="prize">G.2</td>
      <td class="num">${groupNumbers(d.G2,2)}</td>
    </tr>`;

  html+=`
    <tr class="g3">
      <td class="prize">G.3</td>
      <td class="num">${groupNumbers(d.G3,3)}</td>
    </tr>`;

  html+=`
    <tr class="g4">
      <td class="prize">G.4</td>
      <td class="num">${groupNumbers(d.G4,2)}</td>
    </tr>`;

  html+=`
    <tr class="g5">
      <td class="prize">G.5</td>
      <td class="num">${groupNumbers(d.G5,3)}</td>
    </tr>`;

  html+=`
    <tr class="g6">
      <td class="prize">G.6</td>
      <td class="num">${groupNumbers(d.G6,3)}</td>
    </tr>`;

  html+=`
    <tr class="g7">
      <td class="prize">G.7</td>
      <td class="num db">${groupNumbers(d.G7,4)}</td>
    </tr>`;

  document.getElementById("tableBody").innerHTML=html;
}

/* =========================
   RENDER
========================= */
function renderTable(){
  renderTableHead();

  const stations=getStations();

  if(!stations.length){
    document.getElementById("tableBody").innerHTML=`
      <tr><td colspan="6" style="padding:30px">Chưa có dữ liệu.</td></tr>`;
    return;
  }

  if(currentRegion==="mb"){
    renderNorthTable();
  }else{
    renderSouthTable();
  }

  const info=document.getElementById("stationInfo");

  if(currentRegion==="mb"){
    info.textContent="Đang xem: Xổ số miền Bắc - Hà Nội";
  }else if(currentStation===-1){
    info.textContent="Đang xem: Tất cả các đài";
  }else{
    info.textContent="Đang xem: "+stations[currentStation];
  }
}

/* =========================
   TIÊU ĐỀ
========================= */
function updatePage(){
  const regionText=
    currentRegion==="mb"?"XSMB":
    currentRegion==="mt"?"XSMT":"XSMN";

  const regionFull=
    currentRegion==="mb"?"Xổ số miền Bắc":
    currentRegion==="mt"?"Xổ số miền Trung":"Xổ số miền Nam";

  document.getElementById("pageTitle").textContent=
    `${regionText} - Kết quả ${regionFull} - ${regionText}`;

  document.getElementById("breadcrumbRegion").textContent=regionText;
  document.getElementById("breadcrumbDay").textContent=
    `${regionText} ${dayName[currentDay]}`;

  const now=new Date();
  const date=
    String(now.getDate()).padStart(2,"0")+"/"+
    String(now.getMonth()+1).padStart(2,"0")+"/"+
    now.getFullYear();

  document.getElementById("dateText").textContent=date;
  document.getElementById("alertText").textContent=
    `Kết quả ${regionFull} mới nhất 👍`;
}

/* =========================
   CHỌN NGÀY
========================= */
document.querySelectorAll(".day-nav button").forEach(button=>{
  button.onclick=()=>{
    currentDay=button.dataset.day;
    currentStation=-1;

    document.querySelectorAll(".day-nav button")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    updatePage();
    renderStationButtons();
    renderTable();
  };
});

/* =========================
   CHỌN MIỀN
========================= */
document.querySelectorAll(".region-nav button").forEach(button=>{
  button.onclick=()=>{
    document.querySelectorAll(".region-nav button")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    const region=button.dataset.region;

    if(region==="stat"){
      document.getElementById("mainContent").style.display="none";
      document.getElementById("stationNav").style.display="none";
      document.getElementById("statistics").style.display="block";
      return;
    }

    document.getElementById("statistics").style.display="none";
    document.getElementById("mainContent").style.display="block";

    currentRegion=region;
    currentStation=-1;

    updatePage();
    renderStationButtons();
    renderTable();
  };
});

/* =========================
   NGÀY HIỆN TẠI
========================= */
function todayCode(){
  return {
    0:"CN",1:"T2",2:"T3",3:"T4",
    4:"T5",5:"T6",6:"T7"
  }[new Date().getDay()];
}

/* =========================
   KHỞI ĐỘNG
========================= */
currentDay=todayCode();

document.querySelectorAll(".day-nav button").forEach(x=>{
  x.classList.toggle("active",x.dataset.day===currentDay);
});

updatePage();
renderStationButtons();
renderTable();
</script>
</body>
</html>
