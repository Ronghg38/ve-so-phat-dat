<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tham khảo Xổ Số miền Nam</title>
  <!-- Thư viện đóng gói MP4 chuẩn H.264 + AAC Audio cho Facebook -->
  <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.6/fix-webm-duration.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app-bar {
      background-color: #0b4a92;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      height: 32px;
      flex-shrink: 0;
      font-size: 15px;
      font-weight: 600;
    }

    .app-bar-left {
      display: flex;
      align-items: center;
    }

    .app-bar .back-btn {
      margin-right: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    .app-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .rec-badge {
      display: none;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 7px;
      border-radius: 10px;
      color: #ffeb3b;
      font-weight: 700;
    }

    .rec-badge.recording {
      display: flex;
    }

    .rec-dot {
      width: 7px;
      height: 7px;
      background-color: #ff1744;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .control-bar {
      background-color: #ebebeb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      padding: 3px 6px;
      height: 34px;
      flex-shrink: 0;
      border-bottom: 1px solid #dcdcdc;
    }

    .station-select {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 3px 4px;
      font-size: 12px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      color: #0b4a92;
      outline: none;
    }

    .btn-group {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-spin {
      background-color: #f37021;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      min-width: 82px;
      text-align: center;
    }

    .btn-spin.spinning {
      background-color: #d9430f;
    }

    .btn-download {
      display: none;
      background-color: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 7px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn-download.ready {
      display: inline-flex;
    }

    .title-area {
      background-color: #fff;
      text-align: center;
      padding: 2px 0;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }

    .title-area h1 {
      color: #d32f2f;
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.15;
    }

    .title-area p {
      color: #666;
      font-size: 10.5px;
      line-height: 1.1;
    }

    .table-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    .table-header {
      display: flex;
      background-color: #f5f5f5;
      border-bottom: 1px solid #ccc;
      height: 24px;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 13px;
      color: #111;
    }

    .col-giai {
      width: 10%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #e0e0e0;
      font-size: 13px;
      font-weight: 600;
      color: #333;
      background-color: #fafafa;
      flex-shrink: 0;
    }

    .col-station {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid #e0e0e0;
      text-align: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    .col-station:last-child {
      border-right: none;
    }

    .table-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .prize-row {
      display: flex;
      border-bottom: 1px solid #e0e0e0;
      width: 100%;
      min-height: 0;
    }

    .row-g8 { flex: 1.05; }
    .row-g7 { flex: 1; }
    .row-g6 { flex: 2.85; }
    .row-g5 { flex: 1; }
    .row-g4 { flex: 6.4; }
    .row-g3 { flex: 1.9; }
    .row-g2 { flex: 1; }
    .row-g1 { flex: 1; }
    .row-db { flex: 1.15; border-bottom: none; }

    .num-cell {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(15px, 2.55vh, 21px);
      font-weight: 700;
      color: #111;
      letter-spacing: 0.3px;
      line-height: 1;
    }

    .mode-4-cols .num-cell {
      font-size: clamp(13.5px, 2.3vh, 18px);
      letter-spacing: 0px;
    }
    .mode-4-cols .table-header {
      font-size: 12px;
    }

    .row-g8 .num-cell,
    .row-db .num-cell,
    .row-db .col-giai {
      color: #d32f2f;
      font-size: clamp(16px, 2.7vh, 22px);
    }

    .mode-4-cols .row-db .num-cell {
      font-size: clamp(14px, 2.4vh, 19px);
    }

    .num-cell.active-spin {
      background-color: #fff176;
    }

    .footer-bar {
      background-color: #f9f9f9;
      border-top: 1px solid #ccc;
      height: 30px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 500;
      color: #222;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .radio-label input[type="radio"] {
      accent-color: #0b4a92;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 10px;
      padding: 18px 16px;
      width: 100%;
      max-width: 330px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .modal-box h3 {
      color: #0b4a92;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .modal-box p {
      color: #444;
      font-size: 13px;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-save-main {
      background: #1877f2;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .btn-save-dl {
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    .btn-close-modal {
      background: #e0e0e0;
      color: #333;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Thanh tiêu đề kèm nút Bật/Tắt tiếng và Chọn nhạc MP3 -->
  <div class="app-bar">
    <div class="app-bar-left">
      <span class="back-btn">&#8592;</span>
      <span>Quay thử</span>
    </div>
    <div class="app-bar-right">
      <div id="recBadge" class="rec-badge">
        <span class="rec-dot"></span>
        <span id="recTimerText">00:00</span>
      </div>
      <button id="muteBtn" class="sound-btn" onclick="toggleMute()">🔊 Bật tiếng</button>
      <button class="sound-btn" onclick="document.getElementById('mp3Input').click()">🎵 Nhạc MP3</button>
      <input type="file" id="mp3Input" accept="audio/*" style="display:none" onchange="loadCustomMp3(event)">
    </div>
  </div>

  <!-- Thanh điều khiển -->
  <div class="control-bar">
    <select id="daySelect" class="station-select" onchange="changeDay()"></select>
    <div class="btn-group">
      <button id="spinBtn" class="btn-spin" onclick="toggleSpin()">QUAY THỬ</button>
      <button id="downloadBtn" class="btn-download" onclick="openModal()">⬇ VIDEO</button>
    </div>
  </div>

  <!-- Tiêu đề bảng -->
  <div class="title-area">
    <h1>Tham khảo Xổ Số miền Nam</h1>
    <p id="subTitle">Thông tin chỉ mang tính tham khảo</p>
  </div>

  <!-- Bảng kết quả -->
  <div class="table-wrapper" id="tableWrapper">
    <div class="table-header" id="tableHeader"></div>
    <div class="table-body" id="tableBody"></div>
  </div>

  <!-- Tùy chọn hiển thị -->
  <div class="footer-bar">
    <label class="radio-label">
      <input type="radio" name="viewMode" value="all" checked onchange="updateDisplayMode()"> Đầy đủ
    </label>
    <label class="radio-label">
      <input type="radio" name="viewMode" value="2" onchange="updateDisplayMode()"> 2 Số
    </label>
    <label class="radio-label">
      <input type="radio" name="viewMode" value="3" onchange="updateDisplayMode()"> 3 Số
    </label>
  </div>

  <!-- Hộp thoại Xuất Video Chuẩn MP4 có âm thanh -->
  <div id="videoModal" class="modal-overlay">
    <div class="modal-box">
      <h3>Đã xuất Video + Âm thanh!</h3>
      <p id="modalDesc">Video chuẩn MP4 (có tiếng nhạc xổ số) dài 34 giây đã sẵn sàng đăng Facebook / TikTok:</p>
      <div class="modal-actions">
        <button class="btn-save-main" onclick="shareVideoNow()">📤 CHIA SẺ LÊN FACEBOOK / ZALO</button>
        <button class="btn-save-dl" onclick="downloadVideoNow()">⬇ TẢI FILE MP4 VỀ MÁY</button>
        <button class="btn-close-modal" onclick="closeModal()">Đóng</button>
      </div>
    </div>
  </div>

  <canvas id="videoCanvas" width="720" height="1280" style="position:fixed; left:-9999px; top:0; pointer-events:none;"></canvas>

  <script>
    const prizeConfig = [
      { label: '8', class: 'row-g8', count: 1, digits: 2 },
      { label: '7', class: 'row-g7', count: 1, digits: 3 },
      { label: '6', class: 'row-g6', count: 3, digits: 4 },
      { label: '5', class: 'row-g5', count: 1, digits: 4 },
      { label: '4', class: 'row-g4', count: 7, digits: 5 },
      { label: '3', class: 'row-g3', count: 2, digits: 5 },
      { label: '2', class: 'row-g2', count: 1, digits: 5 },
      { label: '1', class: 'row-g1', count: 1, digits: 5 },
      { label: 'ĐB', class: 'row-db', count: 1, digits: 6 }
    ];

    const scheduleByDayIndex = {
      0: { name: 'Chủ Nhật', stations: ['Tiền Giang', 'Kiên Giang', 'Đà Lạt'] },
      1: { name: 'Thứ 2', stations: ['TP.HCM', 'Đồng Tháp', 'Cà Mau'] },
      2: { name: 'Thứ 3', stations: ['Bến Tre', 'Vũng Tàu', 'Bạc Liêu'] },
      3: { name: 'Thứ 4', stations: ['Đồng Nai', 'Cần Thơ', 'Sóc Trăng'] },
      4: { name: 'Thứ 5', stations: ['Tây Ninh', 'An Giang', 'Bình Thuận'] },
      5: { name: 'Thứ 6', stations: ['Vĩnh Long', 'Bình Dương', 'Trà Vinh'] },
      6: { name: 'Thứ 7', stations: ['TP.HCM', 'Long An', 'Bình Phước', 'Hậu Giang'] }
    };

    let currentStations = [];
    let isSpinning = false;
    let activeStep = -1;
    let spinTimeout = null;
    let pauseTimeout = null;
    let finishRecTimeout = null;
    let animInterval = null;
    let totalSteps = 0;

    // TỐC ĐỘ QUAY TỪ TỪ (~32 giây cho 18 giải)
    const TICK_SPEED_MS = 220;
    const STEP_SPIN_MS = 1550;
    const STEP_PAUSE_MS = 250;

    // ================= HỆ THỐNG ÂM THANH XỔ SỐ MIỀN NAM =================
    let audioCtx = null;
    let masterGain = null;
    let streamDest = null;
    let isMuted = false;
    let melodyTimer = null;
    let noteIdx = 0;
    let customAudioBuffer = null;
    let customAudioSource = null;

    // Giai điệu nhạc Xổ Số rộn ràng (tần số Hz của các nốt nhạc)
    const lotteryMelodyNotes = [
      523.25, 659.25, 783.99, 1046.50, 783.99, 1046.50,
      880.00, 698.46, 587.33, 783.99, 659.25, 523.25,
      587.33, 659.25, 698.46, 783.99, 880.00, 987.77,
      1046.50, 783.99, 659.25, 783.99, 1046.50, 0
    ];

    function ensureAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!audioCtx) {
        audioCtx = new AudioContextClass({ sampleRate: 44100 });
        masterGain = audioCtx.createGain();
        masterGain.gain.value = isMuted ? 0 : 0.85;
        streamDest = audioCtx.createMediaStreamDestination();
        // Vừa phát ra loa điện thoại, vừa đưa vào luồng ghi Video
        masterGain.connect(audioCtx.destination);
        masterGain.connect(streamDest);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleMute() {
      isMuted = !isMuted;
      const btn = document.getElementById('muteBtn');
      btn.textContent = isMuted ? '🔇 Tắt tiếng' : '🔊 Bật tiếng';
      if (masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(isMuted ? 0 : 0.85, audioCtx.currentTime);
      }
    }

    // Cho phép người dùng nạp file nhạc MP3 Xổ Số từ điện thoại nếu thích
    function loadCustomMp3(event) {
      const file = event.target.files[0];
      if (!file) return;
      const ctx = ensureAudioContext();
      if (!ctx) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        ctx.decodeAudioData(e.target.result, function(buffer) {
          customAudioBuffer = buffer;
          document.getElementById('subTitle').textContent = `Đã nạp nhạc: ${file.name}`;
        }, function() {
          alert('Không đọc được file âm thanh này, hệ thống sẽ dùng nhạc mặc định.');
        });
      };
      reader.readAsArrayBuffer(file);
    }

    // Tiếng "tạch tạch" khi các con số nhảy
    function playTickSound() {
      if (isMuted || !audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(950, now);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.045);
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.05);
    }

    // Tiếng "Ting!" khi chốt kết quả mỗi hàng (Giải ĐB kêu vang hơn)
    function playLockSound(isSpecial = false) {
      if (isMuted || !audioCtx) return;
      const now = audioCtx.currentTime;
      if (isSpecial) {
        // Nhạc hiệu chúc mừng Giải Đặc Biệt
        const chord = [523.25, 659.25, 783.99, 1046.50];
        chord.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          g.gain.setValueAtTime(0.28, now + idx * 0.09);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.9);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.95);
        });
      } else {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.setValueAtTime(1318.5, now + 0.06);
        g.gain.setValueAtTime(0.22, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
        osc.connect(g);
        g.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.24);
      }
    }

    // Bắt đầu phát nhạc nền Xổ Số
    function startBackgroundMusic() {
      const ctx = ensureAudioContext();
      if (!ctx) return;
      stopBackgroundMusic();

      if (customAudioBuffer) {
        customAudioSource = ctx.createBufferSource();
        customAudioSource.buffer = customAudioBuffer;
        customAudioSource.loop = true;
        const bgGain = ctx.createGain();
        bgGain.gain.value = 0.65;
        customAudioSource.connect(bgGain);
        bgGain.connect(masterGain);
        customAudioSource.start(0);
        return;
      }

      // Phát nhạc hiệu Xổ Số tự động
      noteIdx = 0;
      melodyTimer = setInterval(() => {
        if (isMuted || !audioCtx || !isSpinning) return;
        const freq = lotteryMelodyNotes[noteIdx % lotteryMelodyNotes.length];
        noteIdx++;
        if (freq > 0) {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, now);
          g.gain.setValueAtTime(0.075, now);
          g.gain.exponentialRampToValueAtTime(0.005, now + 0.19);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      }, 210);
    }

    function stopBackgroundMusic() {
      if (melodyTimer) {
        clearInterval(melodyTimer);
        melodyTimer = null;
      }
      if (customAudioSource) {
        try { customAudioSource.stop(); } catch (e) {}
        customAudioSource = null;
      }
    }

    // ================= BIẾN GHI VIDEO MP4 + ÂM THANH =================
    let useHardwareMp4 = false;
    let mp4Muxer = null;
    let videoEncoder = null;
    let audioEncoder = null;
    let audioScriptProcessor = null;
    let frameCount = 0;
    let audioSampleCount = 0;
    const FPS = 30;

    let mediaRecorder = null;
    let recordedChunks = [];
    let frameIntervalId = null;
    let recStartTime = 0;
    let lastVideoBlob = null;
    let lastVideoExt = 'mp4';

    function initDaySelector() {
      const select = document.getElementById('daySelect');
      select.innerHTML = '';

      const now = new Date();
      const todayIdx = now.getDay();
      const tomorrowIdx = (todayIdx + 1) % 7;

      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const isAfterDraw = currentMinutes >= (16 * 60 + 35);

      const orderedIndices = [todayIdx, tomorrowIdx];
      for (let i = 0; i < 7; i++) {
        if (i !== todayIdx && i !== tomorrowIdx) {
          orderedIndices.push(i);
        }
      }

      orderedIndices.forEach(idx => {
        const info = scheduleByDayIndex[idx];
        const opt = document.createElement('option');
        opt.value = idx;

        let prefix = '';
        if (idx === todayIdx) prefix = '[Hôm nay] ';
        else if (idx === tomorrowIdx) prefix = '[Ngày mai] ';

        opt.textContent = `${prefix}${info.name} (${info.stations.join(', ')})`;
        select.appendChild(opt);
      });

      select.value = isAfterDraw ? tomorrowIdx : todayIdx;
      currentStations = scheduleByDayIndex[select.value].stations;
    }

    function initTable() {
      const wrapper = document.getElementById('tableWrapper');
      const thead = document.getElementById('tableHeader');
      const tbody = document.getElementById('tableBody');

      if (currentStations.length === 4) {
        wrapper.classList.add('mode-4-cols');
      } else {
        wrapper.classList.remove('mode-4-cols');
      }

      thead.innerHTML = '<div class="col-giai">Giải</div>';
      currentStations.forEach((stName) => {
        const div = document.createElement('div');
        div.className = 'col-station';
        div.textContent = stName;
        thead.appendChild(div);
      });

      tbody.innerHTML = '';
      let stepIndex = 0;

      prizeConfig.forEach(prize => {
        const row = document.createElement('div');
        row.className = `prize-row ${prize.class}`;

        const colGiai = document.createElement('div');
        colGiai.className = 'col-giai';
        colGiai.textContent = prize.label;
        row.appendChild(colGiai);

        for (let s = 0; s < currentStations.length; s++) {
          const colSt = document.createElement('div');
          colSt.className = 'col-station';

          for (let c = 0; c < prize.count; c++) {
            const cell = document.createElement('div');
            cell.className = 'num-cell';
            cell.id = `cell-s${s}-step${stepIndex + c}`;
            cell.dataset.digits = prize.digits;
            cell.dataset.fullval = '';
            cell.textContent = '•••';
            colSt.appendChild(cell);
          }
          row.appendChild(colSt);
        }

        stepIndex += prize.count;
        tbody.appendChild(row);
      });

      totalSteps = stepIndex;
    }

    function randomNum(digits) {
      let res = '';
      for (let i = 0; i < digits; i++) {
        res += Math.floor(Math.random() * 10);
      }
      return res;
    }

    function formatByMode(val) {
      if (!val) return '•••';
      const mode = document.querySelector('input[name="viewMode"]:checked').value;
      if (mode === '2') return val.slice(-2);
      if (mode === '3') return val.slice(-3);
      return val;
    }

    function updateDisplayMode() {
      document.querySelectorAll('.num-cell').forEach(cell => {
        if (cell.dataset.fullval) {
          cell.textContent = formatByMode(cell.dataset.fullval);
        }
      });
    }

    function changeDay() {
      if (isSpinning) stopSpin(false);
      const val = document.getElementById('daySelect').value;
      currentStations = scheduleByDayIndex[val].stations;
      document.getElementById('downloadBtn').classList.remove('ready');
      initTable();
    }

    function resetBoard() {
      document.querySelectorAll('.num-cell').forEach(cell => {
        cell.classList.remove('active-spin');
        cell.dataset.fullval = '';
        cell.textContent = '•••';
      });
    }

    function openModal() {
      if (lastVideoBlob) {
        document.getElementById('videoModal').classList.add('show');
      }
    }

    function closeModal() {
      document.getElementById('videoModal').classList.remove('show');
    }

    // ================= VẼ KHUNG HÌNH CANVAS =================
    function drawVideoFrame() {
      const canvas = document.getElementById('videoCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#0b4a92';
      ctx.fillRect(0, 0, W, 62);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('←   Quay thử', 24, 31);

      ctx.fillStyle = '#ebebeb';
      ctx.fillRect(0, 62, W, 66);
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 2;
      ctx.fillRect(16, 72, 460, 46);
      ctx.strokeRect(16, 72, 460, 46);

      const sel = document.getElementById('daySelect');
      const dayText = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text.replace(/\[.*?\]\s*/, '') : '';
      ctx.fillStyle = '#222222';
      ctx.font = '600 22px sans-serif';
      ctx.fillText(dayText.substring(0, 28), 28, 95);

      ctx.fillStyle = isSpinning ? '#d9430f' : '#f37021';
      ctx.fillRect(496, 72, 208, 46);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 23px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isSpinning ? 'DỪNG' : 'QUAY THỬ', 600, 95);

      ctx.fillStyle = '#d32f2f';
      ctx.font = 'bold 29px sans-serif';
      ctx.fillText('Tham khảo Xổ Số miền Nam', W / 2, 152);
      ctx.fillStyle = '#666666';
      ctx.font = '21px sans-serif';
      ctx.fillText('Thông tin chỉ mang tính tham khảo', W / 2, 180);

      ctx.strokeStyle = '#dddddd';
      ctx.beginPath();
      ctx.moveTo(0, 196);
      ctx.lineTo(W, 196);
      ctx.stroke();

      const headerY = 196;
      const headerH = 46;
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, headerY, W, headerH);

      const giaiW = W * 0.11;
      const numStations = currentStations.length;
      const stW = (W - giaiW) / numStations;

      ctx.fillStyle = '#111111';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('Giải', giaiW / 2, headerY + headerH / 2);

      currentStations.forEach((st, i) => {
        ctx.fillText(st, giaiW + i * stW + stW / 2, headerY + headerH / 2);
      });

      ctx.strokeStyle = '#cccccc';
      ctx.beginPath();
      ctx.moveTo(0, headerY + headerH);
      ctx.lineTo(W, headerY + headerH);
      ctx.stroke();

      const bodyTop = headerY + headerH;
      const footerH = 56;
      const bodyH = H - bodyTop - footerH;
      const stepH = bodyH / 18;

      let stepIdx = 0;
      prizeConfig.forEach(prize => {
        const rowTop = bodyTop + stepIdx * stepH;
        const rowH = prize.count * stepH;

        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, rowTop, giaiW, rowH);

        ctx.fillStyle = (prize.label === 'ĐB') ? '#d32f2f' : '#333333';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText(prize.label, giaiW / 2, rowTop + rowH / 2);

        for (let c = 0; c < prize.count; c++) {
          const curStep = stepIdx + c;
          const cellTop = rowTop + c * stepH;

          if (curStep === activeStep) {
            ctx.fillStyle = '#fff176';
            ctx.fillRect(giaiW, cellTop, W - giaiW, stepH);
          }

          for (let s = 0; s < numStations; s++) {
            const domCell = document.getElementById(`cell-s${s}-step${curStep}`);
            const textVal = domCell ? domCell.textContent : '•••';
            const cellX = giaiW + s * stW + stW / 2;
            const cellY = cellTop + stepH / 2;

            if (prize.label === '8' || prize.label === 'ĐB') {
              ctx.fillStyle = '#d32f2f';
              ctx.font = numStations === 4 ? 'bold 31px sans-serif' : 'bold 36px sans-serif';
            } else {
              ctx.fillStyle = '#111111';
              ctx.font = numStations === 4 ? 'bold 29px sans-serif' : 'bold 33px sans-serif';
            }
            ctx.fillText(textVal, cellX, cellY);
          }
        }

        ctx.strokeStyle = '#dcdcdc';
        ctx.beginPath();
        ctx.moveTo(0, rowTop + rowH);
        ctx.lineTo(W, rowTop + rowH);
        ctx.stroke();

        stepIdx += prize.count;
      });

      ctx.strokeStyle = '#dcdcdc';
      ctx.beginPath();
      ctx.moveTo(giaiW, headerY);
      ctx.lineTo(giaiW, H - footerH);
      for (let s = 1; s < numStations; s++) {
        const x = giaiW + s * stW;
        ctx.moveTo(x, headerY);
        ctx.lineTo(x, H - footerH);
      }
      ctx.stroke();

      const footerTop = H - footerH;
      ctx.fillStyle = '#f9f9f9';
      ctx.fillRect(0, footerTop, W, footerH);
      ctx.strokeStyle = '#cccccc';
      ctx.beginPath();
      ctx.moveTo(0, footerTop);
      ctx.lineTo(W, footerTop);
      ctx.stroke();

      const mode = document.querySelector('input[name="viewMode"]:checked').value;
      const opts = [
        { k: 'all', l: 'Đầy đủ', x: W * 0.2 },
        { k: '2', l: '2 Số', x: W * 0.5 },
        { k: '3', l: '3 Số', x: W * 0.8 }
      ];

      opts.forEach(o => {
        const cy = footerTop + footerH / 2;
        ctx.strokeStyle = '#0b4a92';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(o.x - 45, cy, 11, 0, Math.PI * 2);
        ctx.stroke();

        if (mode === o.k) {
          ctx.fillStyle = '#0b4a92';
          ctx.beginPath();
          ctx.arc(o.x - 45, cy, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = '#222222';
        ctx.font = '500 23px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(o.l, o.x - 26, cy);
      });
    }

    // ================= GHI VIDEO MP4 KÈM ÂM THANH CHUẨN FACEBOOK =================
    async function startVideoRecording() {
      const canvas = document.getElementById('videoCanvas');
      const ctxAudio = ensureAudioContext();
      document.getElementById('downloadBtn').classList.remove('ready');
      closeModal();
      lastVideoBlob = null;
      frameCount = 0;
      audioSampleCount = 0;
      recStartTime = Date.now();

      drawVideoFrame();

      if (typeof window.Mp4Muxer !== 'undefined' && typeof window.VideoEncoder !== 'undefined') {
        try {
          const codecsToTry = ['avc1.42001f', 'avc1.4d001f', 'avc1.64001f'];
          let supportedVideoCodec = null;
          for (const c of codecsToTry) {
            const sup = await VideoEncoder.isConfigSupported({
              codec: c,
              width: canvas.width,
              height: canvas.height,
              bitrate: 2500000,
              framerate: FPS
            });
            if (sup.supported) {
              supportedVideoCodec = c;
              break;
            }
          }

          // Kiểm tra xem máy có hỗ trợ nén âm thanh AAC vào MP4 không
          let hasAACSupport = false;
          if (typeof window.AudioEncoder !== 'undefined' && ctxAudio) {
            try {
              const aSup = await AudioEncoder.isConfigSupported({
                codec: 'mp4a.40.2',
                sampleRate: ctxAudio.sampleRate,
                numberOfChannels: 1,
                bitrate: 128000
              });
              hasAACSupport = aSup.supported;
            } catch (e) {
              hasAACSupport = false;
            }
          }

          if (supportedVideoCodec) {
            useHardwareMp4 = true;
            const muxerConfig = {
              target: new Mp4Muxer.ArrayBufferTarget(),
              video: {
                codec: 'avc',
                width: canvas.width,
                height: canvas.height
              },
              fastStart: 'in-memory'
            };

            if (hasAACSupport && ctxAudio) {
              muxerConfig.audio = {
                codec: 'aac',
                sampleRate: ctxAudio.sampleRate,
                numberOfChannels: 1
              };
            }

            mp4Muxer = new Mp4Muxer.Muxer(muxerConfig);

            videoEncoder = new VideoEncoder({
              output: (chunk, meta) => mp4Muxer.addVideoChunk(chunk, meta),
              error: (e) => console.error(e)
            });

            videoEncoder.configure({
              codec: supportedVideoCodec,
              width: canvas.width,
              height: canvas.height,
              bitrate: 2500000,
              framerate: FPS
            });

            // Thu âm thanh trực tiếp vào file MP4
            if (hasAACSupport && ctxAudio) {
              audioEncoder = new AudioEncoder({
                output: (chunk, meta) => mp4Muxer.addAudioChunk(chunk, meta),
                error: (e) => console.error(e)
              });
              audioEncoder.configure({
                codec: 'mp4a.40.2',
                sampleRate: ctxAudio.sampleRate,
                numberOfChannels: 1,
                bitrate: 128000
              });

              audioScriptProcessor = ctxAudio.createScriptProcessor(4096, 1, 1);
              masterGain.connect(audioScriptProcessor);
              audioScriptProcessor.connect(ctxAudio.destination);
              audioScriptProcessor.onaudioprocess = (e) => {
                if (!audioEncoder || audioEncoder.state !== 'configured') return;
                const inputData = e.inputBuffer.getChannelData(0);
                const dataCopy = new Float32Array(inputData);
                const timestampUs = Math.round((audioSampleCount * 1000000) / ctxAudio.sampleRate);
                audioSampleCount += dataCopy.length;

                const audioData = new AudioData({
                  format: 'f32-planar',
                  sampleRate: ctxAudio.sampleRate,
                  numberOfFrames: dataCopy.length,
                  numberOfChannels: 1,
                  timestamp: timestampUs,
                  data: dataCopy
                });
                audioEncoder.encode(audioData);
                audioData.close();
              };
            }

            document.getElementById('recBadge').classList.add('recording');
            document.getElementById('recTimerText').textContent = '00:00';

            if (frameIntervalId) clearInterval(frameIntervalId);
            frameIntervalId = setInterval(() => {
              drawVideoFrame();
              if (videoEncoder && videoEncoder.state === 'configured') {
                const timestampUs = Math.round((frameCount * 1000000) / FPS);
                const durationUs = Math.round(1000000 / FPS);
                const frame = new VideoFrame(canvas, { timestamp: timestampUs, duration: durationUs });
                videoEncoder.encode(frame, { keyFrame: frameCount % 30 === 0 });
                frame.close();
                frameCount++;
              }
              const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
              const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
              const ss = String(elapsed % 60).padStart(2, '0');
              document.getElementById('recTimerText').textContent = `${mm}:${ss}`;
            }, 1000 / FPS);

            return;
          }
        } catch (err) {
          useHardwareMp4 = false;
        }
      }

      // Dự phòng MediaRecorder kèm kênh âm thanh
      useHardwareMp4 = false;
      if (!canvas.captureStream || typeof MediaRecorder === 'undefined') return;

      const vStream = canvas.captureStream(FPS);
      const tracks = [...vStream.getVideoTracks()];
      if (streamDest && streamDest.stream.getAudioTracks().length > 0) {
        tracks.push(streamDest.stream.getAudioTracks()[0]);
      }
      const combinedStream = new MediaStream(tracks);

      recordedChunks = [];
      const mimeTypes = ['video/mp4', 'video/webm;codecs=h264,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
      let selectedMime = '';
      for (const m of mimeTypes) {
        if (MediaRecorder.isTypeSupported(m)) {
          selectedMime = m;
          break;
        }
      }

      mediaRecorder = selectedMime
        ? new MediaRecorder(combinedStream, { mimeType: selectedMime, videoBitsPerSecond: 2500000 })
        : new MediaRecorder(combinedStream);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const durationMs = Date.now() - recStartTime;
        const rawBlob = new Blob(recordedChunks, { type: selectedMime || 'video/webm' });

        if (typeof ysFixWebmDuration === 'function' && (!selectedMime || selectedMime.includes('webm'))) {
          ysFixWebmDuration(rawBlob, durationMs, (fixedBlob) => {
            lastVideoBlob = fixedBlob;
            lastVideoExt = 'webm';
            showReadyUI(Math.round(durationMs / 1000));
          });
        } else {
          lastVideoBlob = rawBlob;
          lastVideoExt = (selectedMime && selectedMime.includes('mp4')) ? 'mp4' : 'webm';
          showReadyUI(Math.round(durationMs / 1000));
        }
      };

      mediaRecorder.start();
      document.getElementById('recBadge').classList.add('recording');

      if (frameIntervalId) clearInterval(frameIntervalId);
      frameIntervalId = setInterval(() => {
        drawVideoFrame();
        const elapsed = Math.floor((Date.now() - recStartTime) / 1000);
        const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const ss = String(elapsed % 60).padStart(2, '0');
        document.getElementById('recTimerText').textContent = `${mm}:${ss}`;
      }, 1000 / FPS);
    }

    async function stopVideoRecording(showPopup = true) {
      document.getElementById('recBadge').classList.remove('recording');
      stopBackgroundMusic();

      if (frameIntervalId) {
        clearInterval(frameIntervalId);
        frameIntervalId = null;
      }

      if (audioScriptProcessor) {
        try {
          audioScriptProcessor.disconnect();
          masterGain.disconnect(audioScriptProcessor);
        } catch (e) {}
        audioScriptProcessor = null;
      }

      if (useHardwareMp4 && videoEncoder) {
        try {
          if (showPopup) {
            await videoEncoder.flush();
            if (audioEncoder && audioEncoder.state === 'configured') {
              await audioEncoder.flush();
            }
            mp4Muxer.finalize();
            const { buffer } = mp4Muxer.target;
            lastVideoBlob = new Blob([buffer], { type: 'video/mp4' });
            lastVideoExt = 'mp4';
            const totalSec = Math.round(frameCount / FPS);
            showReadyUI(totalSec);
          }
          videoEncoder.close();
          if (audioEncoder) audioEncoder.close();
        } catch (e) {}
        videoEncoder = null;
        audioEncoder = null;
        mp4Muxer = null;
      } else if (mediaRecorder && mediaRecorder.state === 'recording') {
        if (!showPopup) mediaRecorder.onstop = null;
        mediaRecorder.stop();
      }
    }

    function showReadyUI(durationSec) {
      document.getElementById('modalDesc').textContent =
        `Video MP4 có âm thanh dài ${durationSec} giây (đủ 18 giải) đã sẵn sàng đăng Facebook / TikTok:`;
      document.getElementById('downloadBtn').classList.add('ready');
      document.getElementById('videoModal').classList.add('show');
    }

    async function shareVideoNow() {
      if (!lastVideoBlob) return;
      const fileName = `xsmn-quay-thu-${Date.now()}.${lastVideoExt}`;
      const file = new File([lastVideoBlob], fileName, { type: lastVideoBlob.type });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Tham khảo Xổ Số miền Nam'
          });
          return;
        } catch (err) {}
      }
      downloadVideoNow();
    }

    function downloadVideoNow() {
      if (!lastVideoBlob) return;
      const fileName = `xsmn-quay-thu-${Date.now()}.${lastVideoExt}`;
      const url = URL.createObjectURL(lastVideoBlob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 5000);
      closeModal();
    }

    // ================= ĐIỀU KHIỂN QUAY THỬ =================
    function toggleSpin() {
      if (isSpinning) {
        stopSpin(true);
      } else {
        startSpin();
      }
    }

    function startSpin() {
      clearTimeout(finishRecTimeout);
      isSpinning = true;
      activeStep = 0;
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'DỪNG';
      btn.classList.add('spinning');
      resetBoard();
      startBackgroundMusic();
      startVideoRecording();
      runStep(0);
    }

    function stopSpin(saveVideo = true) {
      isSpinning = false;
      activeStep = -1;
      clearTimeout(spinTimeout);
      clearTimeout(pauseTimeout);
      clearTimeout(finishRecTimeout);
      clearInterval(animInterval);
      const btn = document.getElementById('spinBtn');
      btn.textContent = 'QUAY THỬ';
      btn.classList.remove('spinning');
      document.querySelectorAll('.num-cell.active-spin').forEach(c => {
        c.classList.remove('active-spin');
      });

      if (saveVideo) {
        drawVideoFrame();
        finishRecTimeout = setTimeout(() => {
          stopVideoRecording(true);
        }, 2500);
      } else {
        stopVideoRecording(false);
      }
    }

    function runStep(step) {
      if (!isSpinning || step >= totalSteps) {
        stopSpin(true);
        return;
      }

      activeStep = step;
      const currentCells = [];
      for (let s = 0; s < currentStations.length; s++) {
        currentCells.push(document.getElementById(`cell-s${s}-step${step}`));
      }

      const digits = parseInt(currentCells[0].dataset.digits, 10);

      currentCells.forEach(cell => {
        cell.classList.add('active-spin');
        cell.textContent = formatByMode(randomNum(digits));
      });
      playTickSound();

      animInterval = setInterval(() => {
        currentCells.forEach(cell => {
          cell.textContent = formatByMode(randomNum(digits));
        });
        playTickSound();
      }, TICK_SPEED_MS);

      spinTimeout = setTimeout(() => {
        clearInterval(animInterval);
        currentCells.forEach(cell => {
          const finalVal = randomNum(digits);
          cell.dataset.fullval = finalVal;
          cell.textContent = formatByMode(finalVal);
          cell.classList.remove('active-spin');
        });

        // Phát tiếng chốt số (nếu là bước cuối - Giải ĐB thì phát nhạc chiến thắng)
        playLockSound(step === totalSteps - 1);
        activeStep = -1;

        pauseTimeout = setTimeout(() => {
          runStep(step + 1);
        }, STEP_PAUSE_MS);
      }, STEP_SPIN_MS);
    }

    initDaySelector();
    initTable();
  </script>
